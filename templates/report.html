{% extends "base.html" %}
{% block title %}신고하기{% endblock %}
{% block content %}
<div class="container mt-5">
  <h2>신고하기</h2>
  <form method="POST">
    <div class="form-group">
      <label for="target_id">신고 대상 ID</label>
      <input type="text" class="form-control" id="target_id" name="target_id" required>
    </div>
    <div class="form-group">
      <label for="report_type">신고 유형</label>
      <select class="form-control" id="report_type" name="report_type" required>
        <option value="user">사용자 신고</option>
        <option value="product">상품 신고</option>
      </select>
    </div>
    <div class="form-group">
      <label for="reason">신고 사유</label>
      <textarea class="form-control" id="reason" name="reason" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-danger">신고하기</button>
  </form>
</div>
{% endblock %}
