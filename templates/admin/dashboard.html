{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>관리자 대시보드</h2>

    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">사용자 관리</h5>
                    <p class="card-text">사용자 목록 조회 및 관리</p>
                    <a href="{{ url_for('admin_users') }}" class="btn btn-primary">바로가기</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">상품 관리</h5>
                    <p class="card-text">등록된 상품 조회 및 관리</p>
                    <a href="{{ url_for('admin_products') }}" class="btn btn-primary">바로가기</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">신고 관리</h5>
                    <p class="card-text">신고 내역 조회 및 처리</p>
                    <a href="{{ url_for('admin_reports') }}" class="btn btn-primary">바로가기</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">통계</h5>
                    <p class="card-text">플랫폼 사용 통계 확인</p>
                    <a href="{{ url_for('admin_stats') }}" class="btn btn-primary">바로가기</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
