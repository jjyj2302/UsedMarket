{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>상품 검색</h2>

    <form class="mb-4">
        <div class="row">
            <div class="col-md-6">
                <input type="text" name="q" class="form-control" value="{{ query }}" placeholder="검색어를 입력하세요">
            </div>
            <div class="col-md-2">
                <select name="category" class="form-control">
                    <option value="all" {% if category=='all' %}selected{% endif %}>전체 카테고리</option>
                    <option value="electronics" {% if category=='electronics' %}selected{% endif %}>전자기기</option>
                    <option value="fashion" {% if category=='fashion' %}selected{% endif %}>패션</option>
                    <option value="books" {% if category=='books' %}selected{% endif %}>도서</option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="sort" class="form-control">
                    <option value="recent" {% if sort_by=='recent' %}selected{% endif %}>최신순</option>
                    <option value="price_asc" {% if sort_by=='price_asc' %}selected{% endif %}>가격 낮은순</option>
                    <option value="price_desc" {% if sort_by=='price_desc' %}selected{% endif %}>가격 높은순</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">검색</button>
            </div>
        </div>
    </form>

    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ product.title }}</h5>
                    <p class="card-text">{{ product.description[:100] }}...</p>
                    <p class="card-text">
                        <small class="text-muted">판매자: {{ product.seller_name }}</small>
                    </p>
                    <p class="card-text">
                        <strong>{{ product.price }}원</strong>
                    </p>
                    <a href="{{ url_for('view_product', product_id=product.id) }}" class="btn btn-primary">상세보기</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    {% if not products %}
    <div class="text-center mt-5">
        <p>검색 결과가 없습니다.</p>
    </div>
    {% endif %}
</div>
{% endblock %}
